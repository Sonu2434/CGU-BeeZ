<html lang="en">
  <head>
    <meta charset="utf-8" />

      name="description"
      content="Browse and download CGU previous year question papers"
    />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      :root {
        --color-primary: #ffdb58; /* Mustard Yellow */
        --color-background-dark: #0a0a0a; /* Near Black */
        --color-background-light: #f8f8f8; /* Light Gray */
        --color-card-dark: #181818;
        --color-card-light: #ffffff;
        --color-text-dark: #ffffff;
        --color-text-light: #1a1a1a;
        --color-muted-dark: #888888;
        --color-muted-light: #666666;
      }

      /* Base Styling for Dark Mode (Default) */
      .dark {
        background-color: var(--color-background-dark);
        color: var(--color-text-dark);
        font-family: "Inter", sans-serif;
        transition: background-color 0.3s, color 0.3s;
      }

      /* Card Styles */
      .qb-card {
        background-color: var(--color-card-dark);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transform: translateY(20px);
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      .qb-card.enter {
        transform: translateY(0);
        opacity: 1;
      }

      /* Light Mode Overrides */
      .light {
        background-color: var(--color-background-light);
        color: var(--color-text-light);
      }
      .light .qb-card {
        background-color: var(--color-card-light);
        border: 1px solid rgba(0, 0, 0, 0.1);
      }

      /* Chip Styling */
      .chip {
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--color-muted-dark);
        background-color: transparent;
        color: var(--color-muted-dark);
        transition: background-color 0.2s, color 0.2s, border-color 0.2s;
      }
      .chip[aria-pressed="true"] {
        background-color: var(--color-primary);
        color: var(--color-background-dark);
        border-color: var(--color-primary);
        font-weight: 700;
        box-shadow: 0 4px 10px rgba(255, 219, 88, 0.2);
      }
      .light .chip {
        border: 1px solid var(--color-muted-light);
        color: var(--color-muted-light);
      }
      .light .chip[aria-pressed="true"] {
        color: var(--color-background-dark);
      }

      /* Search Input Focus */
      .qb-search input:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      /* Panel Styling */
      .qb-panel {
        z-index: 50;
        transform: translateX(100%);
        transition: transform 0.4s ease-out;
        background-color: var(--color-background-dark);
        color: var(--color-text-dark);
        border-left: 1px solid rgba(255, 219, 88, 0.1);
      }
      .qb-panel.open {
        transform: translateX(0);
      }
      .light .qb-panel {
        background-color: var(--color-card-light);
        color: var(--color-text-light);
        border-left: 1px solid rgba(0, 0, 0, 0.1);
      }

      /* Button styles (Mustard accent) */
      .qb-btn {
        background-color: var(--color-primary);
        color: var(--color-background-dark);
        font-weight: 600;
        transition: background-color 0.2s, transform 0.1s;
      }
      .qb-btn:hover {
        background-color: #facc15; /* Slightly darker yellow */
      }
      .qb-btn:active {
        transform: scale(0.98);
      }

      .qb-btn.secondary {
        background-color: transparent;
        color: var(--color-primary);
        border: 1px solid var(--color-primary);
      }
      .qb-btn.secondary:hover {
        background-color: rgba(255, 219, 88, 0.1);
        color: var(--color-primary);
      }

      /* Utility for Icons */
      .icon {
        color: var(--color-primary);
      }

      /* PDF Viewer Area */
      #pdfViewerArea canvas {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .light #pdfViewerArea canvas {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      }

      /* Flying Paper for Download Animation */
      @keyframes fly-out {
        0% {
          transform: translate3d(0, 0, 0) scale(0.98);
          opacity: 0.95;
        }
        100% {
          transform: translate3d(-160px, -220px, 0) scale(0.6);
          opacity: 0;
        }
      }
      .flying-paper {
        position: fixed;
        bottom: 50px;
        right: 50px;
        background: var(--color-primary);
        color: var(--color-background-dark);
        padding: 8px 12px;
        border-radius: 8px;
        font-weight: 600;
        z-index: 1000;
        animation: fly-out 0.9s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      /* AI Chat bubble */
      .ai-chat-bubble {
        background-color: var(--color-card-dark);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 8px;
        white-space: pre-wrap;
      }
      .light .ai-chat-bubble {
        background-color: var(--color-card-light);
        border: 1px solid #eee;
      }
      .ai-loading {
        padding: 16px;
        text-align: center;
        color: var(--color-primary);
      }

      /* Bar Chart styles */
      .bar-container {
        display: flex;
        flex-direction: column-reverse;
        height: 150px;
        padding: 8px 0;
        border-left: 1px solid #333;
        border-bottom: 1px solid #333;
      }
      .bar-chart-row {
        display: flex;
        align-items: center;
        height: 25px;
        margin-bottom: 4px;
        font-size: 12px;
      }
      .bar-label {
        width: 120px;
        flex-shrink: 0;
        color: var(--color-muted-dark);
        padding-right: 8px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: right;
      }
      .bar {
        height: 100%;
        background-color: var(--color-primary);
        border-radius: 0 4px 4px 0;
        transition: width 1s ease-out;
        box-shadow: 0 2px 4px rgba(255, 219, 88, 0.2);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 4px;
        color: var(--color-background-dark);
      }
      .light .bar-container {
        border-left: 1px solid #ccc;
        border-bottom: 1px solid #ccc;
      }

      /* Floating Yellow Bubbles */
      .bubbles {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .bubbles span {
        position: absolute;
        bottom: -50px;
        width: 10px;
        height: 10px;
        background: var(--color-primary);
        border-radius: 50%;
        opacity: 0.25;
        animation: bubbleFloat linear infinite;
      }
      @keyframes bubbleFloat {
        from {
          transform: translateY(0) scale(1);
        }
        to {
          transform: translateY(-120vh) scale(0.5);
        }
      }

      /* Enhanced Navbar Glow */
      header > div {
        box-shadow: 0 0 0 rgba(238, 238, 237, 0), 0 10px 30px rgba(0, 0, 0, 0.4);
        transition: box-shadow 0.3s ease;
      }
      header > div:hover {
        box-shadow: 0 0 20px rgba(255, 219, 88, 0.25),
          0 10px 30px rgba(0, 0, 0, 0.4);
      }
    </style>

<script>
  const _hBtn = document.getElementById('hamburgerBtn');
  const _mMenu = document.getElementById('mobileMenu');
  const _bars = _hBtn.querySelectorAll('span');

  _hBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = _mMenu.style.display === 'block';
    _mMenu.style.display = isOpen ? 'none' : 'block';
    // Animate bars to X
    if (!isOpen) {
      _bars[0].style.transform = 'translateY(7px) rotate(45deg)';
      _bars[1].style.opacity = '0';
      _bars[2].style.transform = 'translateY(-7px) rotate(-45deg)';
    } else {
      _bars[0].style.transform = '';
      _bars[1].style.opacity = '';
      _bars[2].style.transform = '';
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#mobileMenu') && !e.target.closest('#hamburgerBtn')) {
      _mMenu.style.display = 'none';
      _bars[0].style.transform = '';
      _bars[1].style.opacity = '';
      _bars[2].style.transform = '';
    }
  });
</script>

    <script>
      // ---------- JS Logic Start ----------

      /* Bubble randomization */
      document.querySelectorAll(".bubbles span").forEach((b) => {
        b.style.left = Math.random() * 100 + "%";
        b.style.animationDuration = 12 + Math.random() * 15 + "s";
        b.style.animationDelay = Math.random() * 5 + "s";
      });

      // Constants
      const KEY_PAPERS = "qb_papers_v2";
      const KEY_BOOKMARKS = "qb_bookmarks_v2";
      const KEY_ANALYTICS = "qb_analytics_v2";
      const KEY_USER = "qb_user_v2";
      const KEY_THEME = "qb_theme";

      // Utility functions
      const $ = (id) => document.getElementById(id);
      function read(key, def) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : def;
        } catch (e) {
          console.error("Error reading localStorage:", e);
          return def;
        }
      }
      function write(key, val) {
        localStorage.setItem(key, JSON.stringify(val));
      }
      function escapeHtml(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[m])
        );
      }

      // ── STEP 4: Initial Data Load from MongoDB ──────────────────────────────
      // papers[] starts empty; filled by loadPapersFromDB() on init.
      let papers = [];
      let bookmarks = new Set(read(KEY_BOOKMARKS, []));
      let analytics = read(KEY_ANALYTICS, { downloads: {} });

      // Fetches from GET /papers and normalises MongoDB docs so existing
      // renderGrid / filter / search / bookmark / preview code needs zero changes.
      async function loadPapersFromDB() {
        try {
          const res = await fetch("https://cgu-beez.onrender.com/papers");
          if (!res.ok) throw new Error("Server returned " + res.status);
          const data = await res.json();

          // Map _id → id and build pdf URL = /download/:id  (STEP 5)
          papers = data.map((p) => ({
            id: p._id,
            title: p.title,
            branch: p.branch,
            subject: p.subject,
            year: p.year,
            downloads: p.downloads || 0,
            pdf: "https://cgu-beez.onrender.com/download/" + p._id,
          }));

          renderChips();
          renderGrid();
          renderAnalyticsChart();
        } catch (err) {
          console.error("Could not load papers from server:", err);
          showToast("Could not connect to server. Showing cached data.", "bg-red-500", 3000);
          papers = read(KEY_PAPERS, []);
          renderChips();
          renderGrid();
          renderAnalyticsChart();
        }
      }

      // DOM refs
      const grid = $("qb-grid");
      const branchesEl = $("qb-branches");
      const subjectsEl = $("qb-subjects");
      const yearsEl = $("qb-years");
      const searchInput = $("qb-search-input");
      const suggestions = $("qb-suggestions");
      const panel = $("qb-panel");
      const panelContent = $("qb-panel-content");
      const panelClose = $("qb-panel-close");
      const openBookmarksEl = $("openBookmarks");
      const qbYear = $("qb-year");
      const searchClear = $("searchClear");
      const emptyHint = $("emptyHint");
      const openAIElem = $("openAI");
      const themeToggle = $("themeToggle");
      const themeIcon = $("themeIcon");

      qbYear.textContent = new Date().getFullYear();

      const state = { branch: null, subject: null, query: "" };

      function applyTheme(theme) {
        const body = document.body;
        if (theme === "light") {
          body.classList.remove("dark");
          body.classList.add("light");
          themeIcon.classList.replace("fa-moon", "fa-sun");
          themeIcon.classList.replace("text-yellow-400", "text-gray-900");
        } else {
          body.classList.remove("light");
          body.classList.add("dark");
          themeIcon.classList.replace("fa-sun", "fa-moon");
          themeIcon.classList.replace("text-gray-900", "text-yellow-400");

        const currentTheme = document.body.classList.contains("dark")

        applyTheme(newTheme);

      /* Chip and Filter Rendering */
      function renderChips() {
        const branches = distinct(papers, "branch");
        const subjects = distinct(papers, "subject");
        

        function build(list, container, key) {
          container.innerHTML = "";
          list.forEach((item) => {
            const b = document.createElement("button");
            b.className = "chip";
            b.textContent = item;
            b.setAttribute("aria-pressed", String(state[key] === item));
            b.addEventListener("click", () => {
              state[key] = state[key] === item ? null : item;
              renderChips();
              renderGrid();
            });
            container.appendChild(b);
          });
        }
        build(branches, branchesEl, "branch");
        build(subjects, subjectsEl, "subject");
        
      }

      function matches(p) {
        if (state.branch && p.branch !== state.branch) return false;
        if (state.subject && p.subject !== state.subject) return false;
        
        const q = (state.query || "").trim().toLowerCase();
        if (q) {
          const hay = (
            p.title +
            " " +
            p.branch +
            " " +
            p.subject +
            " " +
            p.year
          ).toLowerCase();
          return hay.includes(q);
        }
        return true;
      }

      /* PDF.js Viewer */
      async function renderPdfToContainer(url, containerEl) {
        if (typeof pdfjsLib === "undefined") {
          containerEl.innerHTML = `
            <div class="p-6 text-center text-red-400">
              <i class="fas fa-exclamation-circle text-3xl mb-2"></i>
              <p>PDF.js failed to load. Check your internet connection.</p>
            </div>`;
          return;
        }

        containerEl.innerHTML = `
          <div class="flex items-center justify-center py-12 text-yellow-400">
            <i class="fas fa-spinner fa-spin mr-2"></i> Loading PDF…
          </div>`;

        try {
          const loadingTask = pdfjsLib.getDocument({
            url,
            cMapUrl: "https://unpkg.com/pdfjs-dist@2.16.105/cmaps/",
            cMapPacked: true,
          });
          const pdf = await loadingTask.promise;
          const totalPages = pdf.numPages;
          let currentPage = 1;

          // Build viewer layout
          containerEl.innerHTML = `
            <div class="flex flex-col">
              <canvas id="pdfCanvas" class="w-full h-auto block rounded-lg shadow-lg"></canvas>
            </div>`;

          const canvas = document.getElementById("pdfCanvas");
          const ctx    = canvas.getContext("2d");

          async function renderPage(num) {
            currentPage = num;
            const page     = await pdf.getPage(num);
            const viewport = page.getViewport({ scale: 1.6 });
            canvas.width   = Math.floor(viewport.width);
            canvas.height  = Math.floor(viewport.height);
            await page.render({ canvasContext: ctx, viewport }).promise;

            // Update page nav UI
            const pageInfo = document.getElementById("pageInfo");
            const prevBtn  = document.getElementById("prevPage");
            const nextBtn  = document.getElementById("nextPage");
            const pageNav  = document.getElementById("pageNav");

            if (pageInfo) pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            if (prevBtn)  prevBtn.disabled = currentPage <= 1;
            if (nextBtn)  nextBtn.disabled = currentPage >= totalPages;
            if (pageNav && totalPages > 1) pageNav.classList.remove("hidden");
          }

          // Wire prev / next buttons
          document.getElementById("prevPage")?.addEventListener("click", () => {
            if (currentPage > 1) renderPage(currentPage - 1);
          });
          document.getElementById("nextPage")?.addEventListener("click", () => {
            if (currentPage < totalPages) renderPage(currentPage + 1);
          });

          // Keyboard navigation
          const keyHandler = (e) => {
            if (e.key === "ArrowRight" || e.key === "ArrowDown") {
              if (currentPage < totalPages) renderPage(currentPage + 1);
            }
            if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
              if (currentPage > 1) renderPage(currentPage - 1);
            }
          };
          document.addEventListener("keydown", keyHandler);
          // Clean up listener when panel closes
          const origClose = closePanel;

          await renderPage(1);

        } catch (err) {
          console.error("PDF render error:", err);
          containerEl.innerHTML = `
            <div class="p-6 text-center">
              <i class="fas fa-exclamation-triangle text-3xl text-red-400 mb-3"></i>
              <p class="text-red-400 font-semibold mb-1">Preview failed</p>
              <p class="text-xs text-gray-500">${escapeHtml(err.message || String(err))}</p>
              <p class="text-xs text-gray-600 mt-2">This usually happens due to CORS restrictions.<br>Try downloading the file instead.</p>
            </div>`;
        }
      }

              class="qb-btn flex-1 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
              <i class="fas fa-download"></i> Download
            </button>
            <button id="panelBookmark"
              class="qb-btn secondary px-4 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 ${isBookmarked ? "text-yellow-400" : ""}">
              <i class="${isBookmarked ? "fas" : "far"} fa-star"></i>
              ${isBookmarked ? "Saved" : "Save"}
            </button>
            <button id="panelCloseBtn"
              class="qb-btn secondary px-4 py-2.5 rounded-xl text-sm flex items-center justify-center gap-2">
              <i class="fas fa-times"></i>
            </button>
          </div>
        `;

        openPanel();

        // Download button
        document.getElementById("panelDownload")?.addEventListener("click", () => {
          animateDownload(document.getElementById("panelDownload"));
          handleDownload(p.id);
        });

        // Bookmark toggle from preview panel
        document.getElementById("panelBookmark")?.addEventListener("click", () => {
          const bmBtn = document.getElementById("panelBookmark");
          if (bookmarks.has(p.id)) {
            bookmarks.delete(p.id);
            showToast("Bookmark removed.", "bg-red-400");
            bmBtn.innerHTML = `<i class="far fa-star"></i> Save`;
          } else {
            bookmarks.add(p.id);
            showToast("Bookmarked! ⭐", "bg-green-400");
            bmBtn.innerHTML = `<i class="fas fa-star text-yellow-400"></i> Saved`;
          }
          write(KEY_BOOKMARKS, Array.from(bookmarks));
          // Sync star on the card in the grid
          const cardStar = document.querySelector(`.qb-bookmark[data-id="${p.id}"]`);
          if (cardStar) {
            const isNow = bookmarks.has(p.id);
            cardStar.classList.toggle("star", isNow);
            cardStar.innerHTML = isNow
              ? `<i class="fas fa-star text-yellow-400"></i>`
              : `<i class="far fa-star text-gray-400"></i>`;
          }
        });

        // Close button
        document.getElementById("panelCloseBtn")?.addEventListener("click", closePanel);

        // Load PDF
        const viewerArea = document.getElementById("pdfViewerArea");
        if (p.pdf) {
          renderPdfToContainer(p.pdf, viewerArea);
        } else {
          viewerArea.innerHTML = `
            <div class="p-10 text-center text-gray-500">
              <i class="fas fa-file-pdf text-4xl mb-3 text-gray-600"></i>
              <p>No PDF available for this paper.</p>
            </div>`;
        }
      }

      /* AI Assistant Panel */
      openAIElem?.addEventListener("click", openAIPanel);

      function openAIPanel() {
        panelContent.innerHTML = `
              <h3 class="text-2xl font-bold text-yellow-400 mb-4">
                  <i class="fas fa-magic mr-2"></i> AI Assistant
              </h3>
              <p class="text-sm text-gray-500 mb-4">Ask about subjects, syllabus, or common exam topics.</p>

              <div id="aiChatHistory" class="h-64 overflow-y-auto p-3 rounded-lg border border-gray-800 dark:border-gray-700 light:border-gray-300 mb-4 space-y-3">
                  <div class="ai-chat-bubble text-gray-500 dark:text-gray-500 light:text-gray-600">
                      <i class="fas fa-robot mr-2 text-yellow-400"></i>
                      Hello! I can help you with quick summaries and insights. Try asking: "What are the key topics in Data Structures?"
                  </div>
              </div>

              <form id="aiQueryForm" class="flex gap-2">
                  <input id="aiQueryInput" type="text" placeholder="e.g., Summarize COA syllabus" required
                         class="flex-grow p-3 rounded-full bg-gray-900 text-white dark:bg-gray-800 dark:text-white light:bg-white light:text-gray-900 border border-gray-700 light:border-gray-300 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                  <button type="submit" id="aiSubmitBtn" class="qb-btn p-3 rounded-full w-12 h-12 flex items-center justify-center">
                      <i class="fas fa-paper-plane"></i>
                  </button>
              </form>
          `;
        openPanel();
        document
          .getElementById("aiQueryForm")
          ?.addEventListener("submit", handleAIChatSubmit);
      }

      async function handleAIChatSubmit(event) {
        event.preventDefault();
        const inputEl = document.getElementById("aiQueryInput");
        const query = inputEl.value.trim();
        if (!query) return;

        const chatHistoryEl = document.getElementById("aiChatHistory");
        const submitBtn = document.getElementById("aiSubmitBtn");

        // Add user message to history
        chatHistoryEl.innerHTML += `<div class="p-3 bg-yellow-400 text-gray-900 rounded-lg rounded-br-none text-right">${escapeHtml(
          query
        )}</div>`;
        chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

        // Show loading indicator
        const loadingEl = document.createElement("div");
        loadingEl.className = "ai-loading";
        loadingEl.innerHTML =
          '<i class="fas fa-spinner fa-spin mr-2"></i> Thinking...';
        chatHistoryEl.appendChild(loadingEl);
        chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

        inputEl.disabled = true;
        submitBtn.disabled = true;

        try {
          await handleAIChat(query, chatHistoryEl);
        } catch (error) {
          console.error("AI Chat Error:", error);
          loadingEl.innerHTML = `<div class="text-red-500">Error: Could not connect to AI. Please try again.</div>`;
        } finally {
          loadingEl.remove();
          inputEl.value = "";
          inputEl.disabled = false;
          submitBtn.disabled = false;
          inputEl.focus();
        }
      }

      async function handleAIChat(query, chatHistoryEl) {
        const systemPrompt =
          "You are CGU-beeZ AI Assistant, an expert in engineering curriculum and exam patterns. Provide relevant, concise, and helpful information about the requested subject, branch, or year in an engaging tone. Focus on summarizing key topics, exam patterns, or common difficulties. Always ensure your response is based on current, grounded information, and cite your sources if provided.";
        const apiKey = ""; // Canvas environment handles this
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        const payload = {
          contents: [{ parts: [{ text: query }] }],
          tools: [{ google_search: {} }],
          systemInstruction: {
            parts: [{ text: systemPrompt }],
          },
        };

        let responseData;
        let retries = 0;
        const maxRetries = 3;

        while (retries < maxRetries) {
          try {
            const response = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              throw new Error(`API returned status ${response.status}`);
            }

            responseData = await response.json();
            break; // Success! Exit loop
          } catch (error) {
            retries++;
            if (retries >= maxRetries) {
              throw error;
            }
            const delay = Math.pow(2, retries) * 1000;
            await new Promise((resolve) => setTimeout(resolve, delay));
          }
        }

        const candidate = responseData.candidates?.[0];
        let aiText = "Sorry, I couldn't process that request.";
        let sourcesHtml = "";

        if (candidate && candidate.content?.parts?.[0]?.text) {
          aiText = candidate.content.parts[0].text;

          const groundingMetadata = candidate.groundingMetadata;
          if (groundingMetadata && groundingMetadata.groundingAttributions) {
            const sources = groundingMetadata.groundingAttributions
              .map((attribution) => ({
                uri: attribution.web?.uri,
                title: attribution.web?.title,
              }))
              .filter((source) => source.uri && source.title)
              .slice(0, 3); // Limit to 3 sources

            if (sources.length > 0) {
              sourcesHtml =
                '<div class="text-xs mt-3 pt-3 border-t border-gray-700 dark:border-gray-700 light:border-gray-200">';
              sourcesHtml +=
                '<p class="font-semibold mb-1 text-gray-400">Sources:</p>';
              sourcesHtml += sources
                .map(
                  (s) =>
                    `<a href="${escapeHtml(
                      s.uri
                    )}" target="_blank" class="block text-yellow-400 hover:underline truncate" title="${escapeHtml(
                      s.title
                    )}">${escapeHtml(s.title)}</a>`
                )
                .join("");
              sourcesHtml += "</div>";
            }
          }
        }

        // Add AI message to history
        chatHistoryEl.innerHTML += `
              <div class="ai-chat-bubble rounded-tl-none">
                  <i class="fas fa-robot mr-2 text-yellow-400"></i>
                  ${aiText}
                  ${sourcesHtml}
              </div>
          `;
        chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
      }

      /* Panel open/close */
      function openPanel() {
        panel.classList.add("open");
        panel.setAttribute("aria-hidden", "false");
      }
      function closePanel() {
        panel.classList.remove("open");
        panel.setAttribute("aria-hidden", "true");
        // Clear content to prevent memory leaks, especially with PDF viewer
        panelContent.innerHTML = "";
      }
      panelClose.addEventListener("click", closePanel);

      /* Search & suggestions */
      searchInput?.addEventListener("input", (e) => {
        state.query = e.target.value;
        updateSuggestions(state.query);
        renderGrid();
        searchClear.hidden = !state.query;
      });
      searchClear?.addEventListener("click", () => {
        searchInput.value = "";
        state.query = "";
        updateSuggestions("");
        renderGrid();
        searchClear.hidden = true;
      });

      function updateSuggestions(q) {
        if (!q || q.trim().length < 1) {
          hideSuggestions();
          return;
        }
        const low = q.toLowerCase();
        const set = new Set();
        papers.forEach((p) =>
          [p.title, p.subject, p.branch, p.year].forEach((t) => {
            if (t && t.toLowerCase().includes(low)) set.add(t);
          })
        );
        const list = Array.from(set).slice(0, 8);

        suggestions.innerHTML = list
          .map(
            (t, i) =>
              `<li role="option" data-value="${escapeHtml(
                t
              )}" class="p-3 cursor-pointer hover:bg-gray-700 dark:hover:bg-gray-700 light:hover:bg-gray-100 border-b border-gray-800 dark:border-gray-700 light:border-gray-200 last:border-b-0 ${
                i === 0 ? 'aria-selected="true"' : ""
              }">
                <strong>${escapeHtml(t)}</strong>
              </li>`
          )
          .join("");

        suggestions.style.display = list.length ? "block" : "none";
        suggestions.setAttribute("aria-hidden", list.length ? "false" : "true");

        suggestions.querySelectorAll("li").forEach((li) =>
          li.addEventListener("click", (e) => {
            searchInput.value = e.currentTarget.dataset.value;
            state.query = searchInput.value;
            hideSuggestions();
            renderGrid();
          })
        );
      }
      function hideSuggestions() {
        suggestions.style.display = "none";
        suggestions.innerHTML = "";
        suggestions.setAttribute("aria-hidden", "true");
      }

      /* clear filters */
      $("qb-clear")?.addEventListener("click", () => {
       state.branch = state.subject = null;
        renderChips();
        renderGrid();
      });

      /* auth demo */
      $("authBtn")?.addEventListener("click", () => {
        const u = read(KEY_USER, null);
        if (u) {
          // Custom confirm dialog logic needed if not using prompt
          if (window.confirm("Sign out?")) {
            localStorage.removeItem(KEY_USER);
            showToast("Signed out (demo).", "bg-gray-500");
            $("authBtn").textContent = "Login";
          }
          return;
        }
        const name = prompt("Enter your name (demo login)");
        if (name) {
          write(KEY_USER, { name });
          showToast(`Welcome, ${name}!`, "bg-green-500");
          $("authBtn").textContent = "Sign out";
        }
      });

      /* init */
      function init() {
        // Load and apply theme
        const savedTheme = read(KEY_THEME, "dark");
        applyTheme(savedTheme);

        // ── STEP 4: load papers from MongoDB instead of SAMPLE array ────────
        loadPapersFromDB();   // async; renders chips + grid when data arrives
        if (read(KEY_USER, null)) $("authBtn").textContent = "Sign out";

        // Close panel/suggestions on outside click
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".qb-search")) hideSuggestions();
          if (
            !e.target.closest("#qb-panel") &&
            !e.target.closest("#openAdmin") &&
            !e.target.closest("#openBookmarks") &&
            !e.target.closest("#openAI")
          ) {
            // Only close if the panel is open
            if (panel.classList.contains("open")) closePanel();
          }
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            hideSuggestions();
            closePanel();
          }
        });
      }
      init();
    </script>
  </body>
</html>
